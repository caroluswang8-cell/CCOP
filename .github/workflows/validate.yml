name: validate

on:
  push:
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run numerical regression gates
        run: python -m pytest code/test_test1_affine_free_boundary.py code/test_test2_differential_vortex.py -q
      - name: Audit manuscript references and figures
        run: python code/check_tex_static.py ccop_numerical_method.tex

